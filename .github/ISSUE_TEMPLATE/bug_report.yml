name: Bug report
description: Report incorrect behavior with a reproducible example.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command or API request and a minimal example. Use synthetic or consented images; remove personal information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: For incorrect classifications, include score, threshold, resolution, and why the image should pass or fail.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, project version or commit, and relevant installed dependency versions.
    validations:
      required: true
