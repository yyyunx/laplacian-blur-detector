name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build container
        run: docker build --tag sharpness-smoke .
      - name: Start bounded non-root read-only service
        run: |
          docker run --detach --name sharpness-smoke --memory=1536m --cpus=2 --pids-limit=128 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --publish 127.0.0.1:8000:8000 sharpness-smoke
          test "$(docker exec sharpness-smoke id -u)" = 10001
      - name: Live HTTP contracts and bundled assets
        run: python tests/smoke_http.py
      - name: Collect full-image vulnerability report (not release approval)
        run: |
          mkdir -p security-results
          docker exec -i sharpness-smoke python - <<'PY' > security-results/python-installed.json
          import importlib.metadata as metadata
          import json
          from pathlib import Path
          import sysconfig
          packages = sorted([{"name": d.metadata["Name"], "version": d.version} for d in metadata.distributions()], key=lambda d: d["name"].lower())
          evidence = []
          def matches(value):
              if isinstance(value, dict):
                  if str(value.get("name", "")).lower() == "setuptools":
                      evidence.append({k: value.get(k) for k in ("name", "version", "type", "scope", "bom-ref")})
                  for item in value.values():
                      matches(item)
              elif isinstance(value, list):
                  for item in value:
                      matches(item)
          for path in Path(sysconfig.get_paths()["purelib"]).rglob("*.json"):
              if "sbom" in str(path).lower() or ".cdx." in path.name.lower():
                  before = len(evidence)
                  matches(json.loads(path.read_text()))
                  for item in evidence[before:]:
                      item["source"] = str(path)
          print(json.dumps({"installed": packages, "setuptools_sbom_components": evidence}, indent=2))
          PY
          docker run --rm --memory=2g --cpus=2 --pids-limit=128 --volume /var/run/docker.sock:/var/run/docker.sock --volume "$PWD/security-results:/reports" ghcr.io/aquasecurity/trivy:0.76.2 image --image-src docker --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --timeout 5m --format json --output /reports/container.json sharpness-smoke
      - name: Retain vulnerability findings for release review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-results
          path: security-results/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs sharpness-smoke || true
          docker rm --force sharpness-smoke || true
  browser-utils:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser code and CSV/sorting behavior
        run: |
          node --check web/app.js
          node --check web/heatmap.js
          node --check web/quality-diagnostics.js
          node --test tests/web/*.test.mjs
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[server,dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Build source and wheel distributions
        run: python -m build
      - name: Install wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          python -m pip install --force-reinstall --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check installed package outside checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/tests/smoke_installed.py"
      - name: Install source distribution
        shell: pwsh
        run: |
          $sourceArchive = (Get-ChildItem dist/*.tar.gz).FullName
          python -m pip install --force-reinstall --no-deps $sourceArchive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check installed source distribution outside checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/tests/smoke_installed.py"
