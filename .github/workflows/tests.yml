name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser-utils:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser code and CSV/sorting behavior
        run: |
          node --check web/app.js
          node --check web/heatmap.js
          node --test tests/web/*.test.mjs
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[server,dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Build source and wheel distributions
        run: python -m build
      - name: Install wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          python -m pip install --force-reinstall --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check installed package outside checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/tests/smoke_installed.py"
