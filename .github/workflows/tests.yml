name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build container
        run: docker build --tag sharpness-smoke .
      - name: Start bounded non-root read-only service
        run: |
          docker run --detach --name sharpness-smoke --memory=1536m --cpus=2 --pids-limit=128 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --publish 127.0.0.1:8000:8000 sharpness-smoke
          test "$(docker exec sharpness-smoke id -u)" = 10001
      - name: Live HTTP contracts and bundled assets
        run: python tests/smoke_http.py
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs sharpness-smoke || true
          docker rm --force sharpness-smoke || true
  browser-utils:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser code and CSV/sorting behavior
        run: |
          node --check web/app.js
          node --check web/heatmap.js
          node --check web/quality-diagnostics.js
          node --test tests/web/*.test.mjs
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[server,dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Build source and wheel distributions
        run: python -m build
      - name: Install wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          python -m pip install --force-reinstall --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check installed package outside checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/tests/smoke_installed.py"
      - name: Install source distribution
        shell: pwsh
        run: |
          $sourceArchive = (Get-ChildItem dist/*.tar.gz).FullName
          python -m pip install --force-reinstall --no-deps $sourceArchive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check installed source distribution outside checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/tests/smoke_installed.py"
